<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Flag – Character Roulette!</title>
    <meta name="description" content="Spin the wheel and discover your next Last Flag character! The ultimate tool for random contestant selection, featuring premium animations and immersive audio.">
    <meta property="og:image" content="https://raw.githubusercontent.com/PEIEE/lfroulette/main/og-image.png">
    <meta property="twitter:image" content="https://raw.githubusercontent.com/PEIEE/lfroulette/main/og-image.png">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lfroulette.netlify.app/"> <!-- Cambiar por la URL final si se despliega -->
    <meta property="og:title" content="Last Flag – Character Roulette!">
    <meta property="og:description" content="Spin the wheel and discover your next character! Based on the official Last Flag character roster.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Last Flag – Character Roulette!">
    <meta property="twitter:description" content="Spin the wheel and discover your next character! Based on the official Last Flag character roster.">

    <link rel="icon" href="https://lfroulette.netlify.app/og-image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background effects -->
    <div class="bg-effects">
        <div class="bg-grid"></div>
        <div class="bg-vignette"></div>
    </div>

    <!-- Confetti canvas -->
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

    <main class="app">
        <!-- Header -->
        <header class="header" id="header">
            <div class="header-brand">
                <div class="logo-container">
                    <h1 class="logo-title">LAST FLAG</h1>
                    <h2 class="logo-subtitle">CHARACTER ROULETTE</h2>
                </div>
                <div class="logo-icon">
                    <div class="wheel-icon">
                        <div class="wheel-center"></div>
                        <div class="wheel-pointer"></div>
                    </div>
                </div>
            </div>
            <div class="header-controls">
                <button class="lang-toggle" id="lang-toggle" title="Cambiar idioma / Change language" aria-label="Change language">
                    <span class="lang-flag" id="lang-flag">🇬🇧</span>
                    <span class="lang-label" id="lang-label">EN</span>
                </button>
                <button class="sound-toggle" id="sound-toggle" title="Activar/Desactivar sonido" aria-label="Toggle sound">
                    <span class="sound-icon" id="sound-icon">🔊</span>
                </button>
            </div>
        </header>

        <!-- Roulette -->
        <section class="roulette-section" id="roulette-section">
            <div class="roulette-wrapper" id="roulette-wrapper">
                <!-- Top indicator -->
                <div class="roulette-indicator roulette-indicator--top">
                    <div class="indicator-arrow indicator-arrow--down"></div>
                </div>
                <!-- Bottom indicator -->
                <div class="roulette-indicator roulette-indicator--bottom">
                    <div class="indicator-arrow indicator-arrow--up"></div>
                </div>
                <!-- Indicator glow line -->
                <div class="indicator-line"></div>

                <!-- Fade edges -->
                <div class="roulette-fade roulette-fade--left"></div>
                <div class="roulette-fade roulette-fade--right"></div>

                <!-- Viewport -->
                <div class="roulette-viewport" id="roulette-viewport">
                    <div class="roulette-strip" id="roulette-strip"></div>
                </div>
            </div>
        </section>

        <!-- Spin button -->
        <section class="controls" id="controls">
            <button class="spin-btn" id="spin-btn">
                <span class="spin-btn-bg"></span>
                <span class="spin-btn-text" id="spin-btn-text">GIRAR</span>
            </button>
            <p class="controls-hint" id="controls-hint">Pulsa para seleccionar un personaje aleatorio</p>
        </section>

        <!-- Character toggle -->
        <section class="toggle-section" id="toggle-section">
            <p class="toggle-label">Personajes en la ruleta <span class="toggle-count" id="toggle-count">(9/9)</span></p>
            <div class="toggle-grid" id="toggle-grid"></div>
        </section>
        <!-- History Section -->
        <section class="history-section" id="history-section">
            <p class="history-label" id="history-label">HISTORIAL</p>
            <div class="history-list" id="history-list">
                <!-- Previous winners will appear here -->
            </div>
        </section>
    </main>

    <!-- Result Overlay -->
    <div class="result-overlay hidden" id="result-overlay">
        <div class="result-backdrop" id="result-backdrop"></div>
        <div class="result-modal" id="result-modal">
            <div class="result-card-frame">
                <div class="result-card-glow"></div>
                <img class="result-img" id="result-img" src="" alt="">
            </div>
            <h2 class="result-name" id="result-name"></h2>
            <p class="result-subtitle">¡Es tu personaje!</p>
            <p class="result-desc" id="result-desc"></p>
            <div class="result-actions">
                <a href="#" target="_blank" class="result-btn secondary" id="profile-btn">VER PERFIL</a>
                <button class="result-btn" id="result-btn">GIRAR DE NUEVO</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
